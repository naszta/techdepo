# Triage eval set (support.md §10): `cargo run -p xtask -- eval classify [--backend mock|workers-ai]`.
#
# Every case is one inbound customer email, classified exactly as `Router/route` classifies a
# ticket's first message ("Subject: …" + body, `router::triage_questions`), then decided with
# `router::decide` and the default org settings (threshold 0.70, margin 0.15).
#
#   intent:  the intent a careful person would pick; a list when two are equally right
#            (the top intent counts as correct if it is any of them)
#   outcome: what the router should do: `route` (dispatch the intent's route), `escalate` (hand
#            to a person) or `close` (a thank-you, nothing to answer); a list when either is fine
#   tags:    groups for the per-tag table (clear, short, multi, vague, angry, human, legal,
#            injection, non_english, thanks, off_topic)
#
# Two more sets cover the classifications that answer a question we asked (xtask eval/replies.rs):
#
#   follow_ups:    the customer writes while a route waits for its question's answer (`asked`:
#                  the route's intent and what it asked for). Expected `outcome`: `resume` (it
#                  answers: back to that route), `route` (a new request; `intent` says which),
#                  `escalate` or `close`. Demo scenario 7.
#   offer_replies: a reply to the lost-parcel offer (`offer`: refund, reship or both), read as
#                  `Investigation` reads it in round 1. Expected `step`: `refund`, `reship`,
#                  `declined` (a person), `clarify` (ask again) or `escalate` (wants a person,
#                  legal threat). Demo scenarios 4 and 5.
#
# Run it again when the classifier model, the question wording or the intent descriptions change.

# The run fails when a metric is below its minimum (any backend).
minimums:
  # Top intent is (one of) the expected intent(s).
  intent_accuracy: 0.80
  # route / escalate / close as expected.
  decision_accuracy: 0.85
  # Of the cases that must reach a person, the share that does.
  escalation_recall: 0.90
  # Of the dispatched cases, the share sent to the route of an intent the customer did not
  # express. (Dispatching one of several intents instead of escalating counts against
  # escalation_recall.)
  max_wrong_route_rate: 0.05
  # follow_ups: resume / route / escalate / close as expected.
  follow_up_accuracy: 0.85
  # offer_replies: refund / reship / declined / clarify / escalate as expected.
  offer_reply_accuracy: 0.85
  # Of the offer replies, the share that ends in a refund or replacement the customer did not
  # choose (it moves money or goods): none.
  max_offer_wrong_action_rate: 0.0

