# --- follow-ups: a route's question is pending --------------------------------------------------
follow_ups:
  - id: fu-order-number
    tags: [answer]
    asked: { intent: cancel_order, expects: order_number }
    body: It's TD-1042.
    outcome: resume

  - id: fu-number-in-a-sentence
    tags: [answer]
    asked: { intent: refund_or_return, expects: order_number }
    body: Sorry, I meant order TD-1187, the one with the graphics card.
    outcome: resume

  - id: fu-number-not-theirs
    tags: [answer]
    asked: { intent: cancel_order, expects: order_number }
    body: I think it was TD-9999
    outcome: resume

  - id: fu-clarification
    tags: [answer]
    asked: { intent: product_advice, expects: clarification }
    body: My budget is about 150 euros for the graphics card, I play at 1440p. What would you recommend?
    # The same route either way: resumed, or routed again as product advice.
    outcome: [resume, route]
    intent: product_advice

  - id: fu-new-question
    tags: [new_request]
    asked: { intent: cancel_order, expects: order_number }
    body: Also, is the Kestrel B650 Aero board compatible with DDR5 memory?
    outcome: route
    intent: product_advice

  - id: fu-changed-request
    tags: [new_request]
    asked: { intent: cancel_order, expects: order_number }
    body: Forget the cancellation, where is my parcel? The tracking has not moved for days.
    outcome: [route, escalate]
    intent: order_status

  - id: fu-wants-human
    tags: [human]
    asked: { intent: cancel_order, expects: order_number }
    body: I don't have the number at hand. Just let me talk to a real person.
    outcome: escalate

  - id: fu-legal-with-number
    tags: [legal]
    asked: { intent: refund_or_return, expects: order_number }
    body: TD-1042. If the refund is not done this week I am calling my lawyer.
    outcome: escalate

  - id: fu-thanks
    tags: [thanks]
    asked: { intent: cancel_order, expects: order_number }
    body: Thanks!
    outcome: close

# --- offer replies: the lost-parcel offer, round 1 -----------------------------------------------
offer_replies:
  - id: or-refund
    tags: [clear]
    offer: both
    body: I'd prefer my money back please.
    step: refund

  - id: or-reship
    tags: [clear]
    offer: both
    body: Just send a new one please.
    step: reship

  - id: or-decline
    tags: [clear]
    offer: both
    body: No thanks, neither. I will buy it somewhere else.
    step: declined

  - id: or-refund-offered
    tags: [clear]
    offer: refund
    body: Yes, please refund it.
    step: refund

  - id: or-reship-offered
    tags: [clear]
    offer: reship
    body: Yes please, send the replacement to the same address.
    step: reship

  - id: or-unclear
    tags: [vague]
    offer: both
    body: hmm, not sure, what do you think?
    step: clarify

  - id: or-undecided
    tags: [vague]
    offer: both
    body: A refund, or maybe a replacement?
    step: clarify

  - id: or-not-offered
    tags: [vague]
    offer: reship
    body: I'd rather have a refund.
    # A refund was not offered: ask again, never act.
    step: clarify

  - id: or-lawyer
    tags: [legal]
    offer: both
    body: Give me my money back or I am calling my lawyer.
    step: escalate

  - id: or-decline-and-human
    tags: [human]
    offer: both
    body: No thanks, I want neither of those. I want to talk to someone about this.
    # A decline reaches a person anyway, with its offers_declined task.
    step: [declined, escalate]

  - id: or-wants-human
    tags: [human]
    offer: both
    body: Before I decide, can I talk to a real person about this?
    step: escalate

  - id: or-hungarian
    tags: [non_english]
    offer: both
    body: Kérem a pénzem vissza.
    step: [refund, clarify]
