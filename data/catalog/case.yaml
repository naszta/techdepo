# Cases. Schema: data/catalog/README.md
#
# Tiers by price: budget < €80, mid €80–€149.99, high ≥ €150.
# Convention: an ATX-only case lists only `atx` PSUs (no SFX bracket is
# included, so an SFX unit needs one: a warning); a case that ships with an
# SFX bracket lists both. `max_gpu_slots` is the thickest card in expansion slots.

# --- Budget ----------------------------------------------------------------

- id: lattice-core-200
  sku: CASE-LAT-CORE200
  brand: Lattice
  name: Lattice Core 200
  price_cents: 4990
  default_stock: 30
  tier: budget
  tags: [atx, budget, mid-tower]
  summary: An affordable ATX mid tower with a mesh front, one fan included and room for 240 mm radiators.
  spec:
    size: mid_tower
    motherboard_form_factors: [atx, micro_atx, mini_itx]
    max_gpu_length_mm: 315
    max_gpu_slots: 7
    max_cooler_height_mm: 158
    psu_form_factors: [atx]
    max_psu_length_mm: 170
    radiator_mounts:
      - { position: front, sizes_mm: [120, 140, 240] }
      - { position: top, sizes_mm: [120, 240] }
      - { position: rear, sizes_mm: [120] }
    bays_2_5: 2
    bays_3_5: 2
    included_fans: 1

